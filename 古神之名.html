<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>古神之名 · 本家OC名录</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#0b0d12;color:#d8d3c4;font-family:"Songti SC",SimSun,"Noto Serif SC",serif;padding:24px;}
  .wrap{max-width:820px;margin:0 auto;}
  h1{color:#cbb689;text-align:center;font-size:30px;letter-spacing:6px;margin-bottom:6px;text-shadow:0 0 18px rgba(203,182,137,.35);}
  .sub{text-align:center;color:#8a836e;font-size:13px;letter-spacing:2px;margin-bottom:22px;}

  /* ===== 顶部导航 ===== */
  .nav{display:flex;justify-content:center;gap:8px;margin-bottom:30px;flex-wrap:wrap;}
  .nav button{background:#14161d;border:1px solid #2a2d38;color:#8a836e;padding:9px 20px;border-radius:6px;cursor:pointer;font-size:15px;letter-spacing:2px;transition:all .2s;}
  .nav button.on{background:#20242f;border-color:#cbb689;color:#cbb689;text-shadow:0 0 10px rgba(203,182,137,.4);}
  .nav button:hover{border-color:#cbb689;color:#cbb689;}

  .page{display:none;}
  .page.on{display:block;}
  .pagehead{color:#8a836e;font-size:13px;letter-spacing:2px;text-align:center;margin-bottom:20px;}

  /* ===== 卡片 ===== */
  .card{background:#14161d;border:1px solid #2a2d38;border-radius:10px;padding:22px;margin-bottom:22px;box-shadow:0 4px 20px rgba(0,0,0,.4);}
  .card .rank{display:inline-block;color:#cbb689;border:1px solid #cbb689;border-radius:50%;width:30px;height:30px;line-height:28px;text-align:center;font-size:14px;margin-bottom:10px;font-style:normal;}
  .card .name{font-size:22px;color:#efe6d0;margin-bottom:4px;}
  .card .mystery{background:#0e1016;border:1px dashed #3a3d4a;padding:10px 14px;border-radius:6px;font-size:14px;color:#b8ae93;letter-spacing:1px;margin:10px 0 4px 0;}
  .card .mystery b{color:#cbb689;font-weight:normal;}
  .card .lock{color:#7d7461;font-size:12px;font-style:italic;margin-bottom:12px;}
  .card .body{display:none;background:#171a22;border-left:3px solid #cbb689;padding:14px 16px;border-radius:0 6px 6px 0;color:#e2d9c2;line-height:1.85;font-size:15px;margin-top:14px;}
  .card .body.show{display:block;}
  .card .body b.hd{color:#cbb689;display:block;margin-bottom:6px;letter-spacing:1px;}
  .card .form{display:flex;gap:8px;margin-top:14px;}
  .card input[type=text]{flex:1;background:#0e1016;border:1px solid #2f323f;color:#efe6d0;padding:10px;border-radius:6px;font-size:14px;outline:none;}
  .card input[type=text]:focus{border-color:#cbb689;}
  .card button{background:#20242f;border:1px solid #3a3e4d;color:#cbb689;padding:10px 18px;border-radius:6px;cursor:pointer;font-size:14px;}
  .card button:hover{background:#2a2f3c;border-color:#cbb689;}
  .card .hint{color:#6f6755;font-size:12px;margin-top:10px;}
  .card .hint.done{color:#8a985f;}

  .pic{width:100%;border-radius:6px;border:1px solid #2a2d38;margin-top:12px;display:block;}
  .longtext{color:#e2d9c2;line-height:2;font-size:15px;white-space:pre-wrap;}

  .admin{display:none;background:#14161d;border:1px solid #7a5d2a;border-radius:10px;padding:22px;margin:22px 0;}
  .admin h3{color:#cbb689;margin-bottom:6px;letter-spacing:3px;}
  .admin h3{color:#cbb689;margin-bottom:6px;letter-spacing:3px;}
  .admin .tabs{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap;}
  .admin .tabs button{padding:6px 14px;font-size:13px;}
  .admin .tabs button.on{background:#2a2f3c;border-color:#cbb689;}
  .admin .row{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap;}
  .admin label{width:96px;color:#9a8f75;font-size:13px;}
  .admin input[type=text]{flex:1;min-width:160px;background:#0e1016;border:1px solid #2f323f;color:#efe6d0;padding:8px;border-radius:5px;font-size:13px;outline:none;}
  .admin textarea{width:100%;background:#0e1016;border:1px solid #2f323f;color:#efe6d0;padding:10px;border-radius:5px;font-size:13px;min-height:70px;line-height:1.6;resize:vertical;outline:none;}
  .admin button{background:#20242f;border:1px solid #3a3e4d;color:#cbb689;padding:8px 16px;border-radius:5px;cursor:pointer;font-size:13px;margin-top:6px;}
  .admin button:hover{background:#2a2f3c;border-color:#cbb689;}
  .admin .del{color:#c96a5f;border-color:#6a3630;}
  .admin .del:hover{background:#2a1a18;border-color:#c96a5f;}
  .admin .sep{border-top:1px dashed #3a3e4d;margin:18px 0;}
  .admin .tip{color:#7d7461;font-size:12px;margin-top:6px;}
  .pwbox{background:#12141a;border:1px dashed #3a3e4d;padding:16px;border-radius:8px;margin-top:14px;}
  .pwbox h4{color:#cbb689;font-size:14px;margin-bottom:10px;letter-spacing:2px;}
  .closeBtn{float:right;background:none;border:none;color:#8a836e;font-size:18px;cursor:pointer;}
  .closeBtn:hover{color:#cbb689;}
  img.missing{opacity:.5;}
</style>
</head>
<body>
<div class="wrap">
  <h1>古神之名</h1>
  <div class="sub">—— 本家子女 · 秘辛访录 ——</div>

  <div class="nav">
    <button class="navbtn on" data-page="p1" onclick="showPage('p1',this)">壹 · 名录</button>
    <button class="navbtn" data-page="p2" onclick="showPage('p2',this)">贰 · 图鉴</button>
    <button class="navbtn" data-page="p3" onclick="showPage('p3',this)">叁 · 秘辛</button>
  </div>

  <!-- 第1页 名录 -->
  <div class="page on" id="p1">
    <div class="pagehead">—— 每位祂，须以真名叩门，方可一见 ——</div>
    <div id="ocList"></div>
  </div>

  <!-- 第2页 图鉴 -->
  <div class="page" id="p2">
    <div class="pagehead">—— 名既揭，影亦现。图以此奉 ——</div>
    <div id="imgList"></div>
  </div>

  <!-- 第3页 秘辛 -->
  <div class="page" id="p3">
    <div class="pagehead">—— 秘辛长卷 · 名既揭，卷方开 ——</div>
    <div id="longList"></div>
  </div>

  <div class="admin" id="adminPanel">
    <span class="closeBtn" onclick="document.getElementById('adminPanel').style.display='none'">✕</span>
    <h3 id="adminTitle">管理</h3>
    <div id="adminTabs" class="tabs"></div>
    <div id="adminBody"></div>
  </div>
</div>

<script>
  // ===== 存储键名 =====
  const LS = "benjia_ocs";
  const LSP = "benjia_pwd";

  // ===== 三个默认OC =====
  const defaultOC = [
    { id:"a", code:"ashria", title:"徐灵", en:"Ash'ria",
      mystery:"WLVH ZKLWH", note:"凯撒 +3", img:"", long:"",
      lock:"乱页藏真之神 · 她的名字沉在未翻开的书页下",
      story:"老大·徐灵，真名阿希翠娅（Ash'ria）。乱页藏真之神。塔罗师，爱人，有妻。她守着无数被封存的真相，只为等待一个真正愿意翻开它们的人。" },
    { id:"b", code:"enor", title:"徐萤", en:"Enor",
      mystery:"HQRU", note:"凯撒 +3", img:"", long:"",
      lock:"聆无可聆之祀乐神 · 无声的祷歌绕梁而继",
      story:"老二·徐萤，真名伊诺尔（Enor）。聆无可聆之祀乐神。她聆听那些无人听见的低语，将终将被遗忘的声音谱成不散的回响。" },
    { id:"c", code:"jiuyi", title:"徐静依", en:"Jiuyi",
      mystery:"MLXL", note:"凯撒 +3", img:"", long:"",
      lock:"九尾狐 · 只立名，不入神典",
      story:"老三·徐静依，真名玖仪（Jiuyi）。本相一尾九尾狐，观十万里云起云灭。她不在众神名册上，只立自己的名，行自己的路。" }
  ];

  // ===== 数据加载（含旧数据 img/long 字段补齐迁移）=====
  function loadOCs(){
    let arr = null;
    try{ const raw = localStorage.getItem(LS); if(raw) arr = JSON.parse(raw); }catch(e){}
    if(!Array.isArray(arr) || arr.length===0){
      arr = defaultOC.map(x=>Object.assign({},x));
    } else {
      arr = arr.map((o,i)=>{
        const d = defaultOC[i] || {};
        return Object.assign({}, d, o, {
          img:  o.img  !=null ? o.img  : (d.img  || ""),
          long: o.long !=null ? o.long : (d.long || "")
        });
      });
    }
    localStorage.setItem(LS, JSON.stringify(arr));
    return arr;
  }

  function loadPwd(){
    try{
      const raw = localStorage.getItem(LSP);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    const d = {a:"sphinx", c:"gatekeeper"};
    localStorage.setItem(LSP, JSON.stringify(d));
    return d;
  }

  const pwd = loadPwd();
  let OCS = loadOCs();

  // ===== 本会话内解锁状态（刷新即重置，三页共享）=====
  const unlockedSet = {};

  function showPage(id, btn){
    document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on', p.id===id));
    document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('on', b.dataset.page===id));
  }
  function isUnlocked(id){ return !!unlockedSet[id]; }

  function esc(s){ return (s==null?"":String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'"'); }

  // ===== 第1页：名录 =====
  function renderList(){
    const box = document.getElementById("ocList");
    box.innerHTML = "";
    OCS.forEach((o,i)=>{
      const u = isUnlocked(o.id);
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML =
        '<span class="rank">'+(i+1)+'</span>' +
        '<div class="name">'+esc(o.title)+'</div>' +
        (o.mystery?'<div class="mystery"><b>密语</b> · '+esc(o.mystery)+(o.note?'<small style="color:#7d7461">（'+esc(o.note)+'）</small>':'')+'</div>':'') +
        '<div class="lock">'+esc(o.lock)+'</div>' +
        '<div class="body'+(u?' show':'')+'"><b class="hd">揭开的秘辛 · 真名「'+esc(o.en)+'」</b>'+esc(o.story)+'</div>' +
        '<div class="form"><input type="text" id="inp-'+o.id+'" placeholder="'+(u?'此人已解开':'输入古神真名……')+'"><button onclick="un(\''+o.id+'\')">'+(u?'重新等':'揭开')+'</button></div>' +
        (u?'<div class="hint done">此身已揭开 · 影与长卷同启。</div>':'<div class="hint">真名三页通用 · 解过即开其图其卷。</div>');
      box.appendChild(card);
    });
  }

  // ===== 第2页：图鉴 =====
  function renderGallery(){
    const box = document.getElementById("imgList");
    box.innerHTML = "";
    OCS.forEach((o,i)=>{
      const u = isUnlocked(o.id);
      const card = document.createElement("div");
      card.className = "card";
      let inner =
        '<span class="rank">'+(i+1)+'</span>' +
        '<div class="name">'+esc(o.title)+'</div>' +
        (o.mystery?'<div class="mystery"><b>密语</b> · '+esc(o.mystery)+'</div>':'') +
        '<div class="lock">'+esc(o.lock)+'</div>';
      if(u){
        inner += '<div class="body show"><b class="hd">影 · 真名「'+esc(o.en)+'」</b>' +
          (o.img
            ? '<img class="pic" id="imgshow-'+o.id+'" src="'+esc(o.img)+'" alt="『'+esc(o.en)+'』之影" onerror="this.classList.add(\'missing\')">'
            : '<div class="tip" style="margin-top:10px">（此位居暂无图，可于管理层·图鉴 粘贴链接载入）</div>') +
          '</div>';
      } else {
        inner += '<div class="body" id="imgbox-'+o.id+'"></div>';
      }
      inner += '<div class="form"><input type="text" id="inpimg-'+o.id+'" placeholder="输入古神真名……"><button onclick="unGallery(\''+o.id+'\')">窥影</button></div>';
      inner += u ? '<div class="hint done">此身已揭开 · 影已显。</div>' : '<div class="hint">其影封印待名 · 真名三页通用。</div>';
      card.innerHTML = inner;
      box.appendChild(card);
    });
  }

  // ===== 第3页：秘辛长卷 =====
  function renderLong(){
    const box = document.getElementById("longList");
    box.innerHTML = "";
    OCS.forEach((o,i)=>{
      const u = isUnlocked(o.id);
      const card = document.createElement("div");
      card.className = "card";
      let inner =
        '<span class="rank">'+(i+1)+'</span>' +
        '<div class="name">'+esc(o.title)+'</div>' +
        (o.mystery?'<div class="mystery"><b>密语</b> · '+esc(o.mystery)+'</div>':'') +
        '<div class="lock">'+esc(o.lock)+'</div>';
      if(u){
        inner += '<div class="body show"><b class="hd">秘辛长卷 · 真名「'+esc(o.en)+'」</b>' +
          '<div class="longtext">'+esc(o.long||'（长卷尚未书写……）')+'</div></div>';
      } else {
        inner += '<div class="body" id="longbox-'+o.id+'"></div>';
      }
      inner += '<div class="form"><input type="text" id="inplong-'+o.id+'" placeholder="输入古神真名……"><button onclick="unLong(\''+o.id+'\')">展卷</button></div>';
      inner += u ? '<div class="hint done">此卷已开。</div>' : '<div class="hint">卷宗封印 · 待真名开启。</div>';
      card.innerHTML = inner;
      box.appendChild(card);
    });
  }

  // ===== 统一解锁入口（含管理暗门 + 角色级解密）=====
  function unboxed(id, inputId){
    const inp = document.getElementById(inputId);
    if(!inp) return;
    const v = (inp.value||"").replace(/\s+/g,"").toLowerCase();
    inp.value = "";
    if(!v) return;

    // 管理暗门（按固定 id 识别入口）
    if(id==="a" && v===pwd.a){ openAdmin(1); return; }
    if(id==="c" && v===pwd.c){ openAdmin(2); return; }

    const o = OCS.find(x=>x.id===id);
    if(!o) return;
    if(v===o.code){
      unlockedSet[id] = true;
      renderAll();
    } else {
      alert("密文未解开……再想想？");
    }
  }
  function un(id){ unboxed(id, "inp-"+id); }
  function unGallery(id){ unboxed(id, "inpimg-"+id); }
  function unLong(id){ unboxed(id, "inplong-"+id); }

  function renderAll(){ renderList(); renderGallery(); renderLong(); }
  renderAll();

  // ===== 管理 =====
  let adminLevel = 1;
  let adminTab = "story";
  function openAdmin(lv){
    adminLevel = lv;
    document.getElementById("adminTitle").innerHTML = lv===1 ? "第一层 · 整理文字" : "第二层 · 全权管理";
    document.getElementById("adminPanel").style.display = "block";
    renderAdminTabs(); renderAdminBody();
    document.getElementById("adminPanel").scrollIntoView({behavior:"smooth"});
  }
  function setAdminTab(t){ adminTab = t; renderAdminTabs(); renderAdminBody(); }
  function renderAdminTabs(){
    const tabs = document.getElementById("adminTabs");
    tabs.innerHTML =
      '<button class="'+(adminTab==="story"?"on":"")+'" onclick="setAdminTab(\'story\')">名录文字</button>' +
      '<button class="'+(adminTab==="img"?"on":"")+'" onclick="setAdminTab(\'img\')">图鉴图片</button>' +
      '<button class="'+(adminTab==="long"?"on":"")+'" onclick="setAdminTab(\'long\')">秘辛长文</button>';
  }
  function renderAdminBody(){
    const body = document.getElementById("adminBody");
    body.innerHTML = "";
    if(adminTab==="img"){ adminSectionImgs(body); return; }
    if(adminTab==="long"){ adminSectionLongs(body); return; }
    adminSectionStory(body);
  }

  function adminFooter(body){
    if(adminLevel===2){
      body.innerHTML += '<div class="sep"></div>' +
        '<div class="row"><label>新称号</label><input type="text" id="newT"></div>' +
        '<div class="row"><label>西式名</label><input type="text" id="newE"></div>' +
        '<div class="row"><label>古神名</label><input type="text" id="newC"></div>' +
        '<div class="row"><label>密语</label><input type="text" id="newM"></div>' +
        '<div class="row"><label>提示</label><input type="text" id="newL"></div>' +
        '<label>秘辛故事</label><textarea id="newS"></textarea>' +
        '<button onclick="addOC()">＋ 新增一位（三页自动同步建块）</button>' +
        '<div class="sep"></div><div class="pwbox"><h4>🔑 管理密令</h4>' +
        '<div class="row"><label>一层密令</label><input type="text" id="pA" value="'+esc(pwd.a)+'"></div>' +
        '<div class="row"><label>二层密令</label><input type="text" id="pC" value="'+esc(pwd.c)+'"></div>' +
        '<button onclick="savePwd()">保存密令</button>' +
        '<div class="tip">一层=整理文字 · 二层=全权(删/增/改密/三页一切)</div></div>';
    }
  }

  function adminSectionStory(body){
    OCS.forEach((o)=>{
      const div = document.createElement("div");
      div.style.borderBottom = "1px solid #262a35";
      div.style.marginBottom = "14px";
      div.style.paddingBottom = "14px";
      div.innerHTML =
        '<div class="row"><label>称号</label><input type="text" id="t-'+o.id+'" value="'+esc(o.title)+'"></div>' +
        '<div class="row"><label>排名</label><input type="text" id="r-'+o.id+'" value="'+esc(o.rank||"")+'" style="max-width:80px"></div>' +
        '<div class="row"><label>提示</label><input type="text" id="l-'+o.id+'" value="'+esc(o.lock)+'"></div>' +
        '<label>秘辛故事</label><textarea id="s-'+o.id+'">'+esc(o.story)+'</textarea>' +
        '<button onclick="saveStory(\''+o.id+'\')">保存此篇</button> ' +
        (adminLevel===2?'<button class="del" onclick="delOC(\''+o.id+'\')">删除此位</button>':'');
      body.appendChild(div);
    });
    adminFooter(body);
  }

  function adminSectionImgs(body){
    OCS.forEach((o)=>{
      const div = document.createElement("div");
      div.style.borderBottom = "1px solid #262a35";
      div.style.marginBottom = "14px";
      div.style.paddingBottom = "14px";
      div.innerHTML =
        '<div style="color:#cbb689;margin-bottom:6px;">'+esc(o.title)+' <small style="color:#7d7461">('+esc(o.id)+')</small></div>' +
        '<div class="row"><label>图片链接</label><input type="text" id="im-'+o.id+'" value="'+esc(o.img||"")+'" placeholder="粘贴图片网址 或 本地图片路径"></div>' +
        (o.img?'<div><img class="pic" style="max-width:240px" src="'+esc(o.img)+'" alt="" onerror="this.outerHTML=\'<small class=tip>（链接无效或图片无法加载）</small>\'"></div>':'') +
        '<button onclick="saveImg(\''+o.id+'\')">保存图片</button>';
      body.appendChild(div);
    });
    if(adminLevel===2){
      body.innerHTML += '<div class="sep"></div>';
    }
    adminFooterForLvl(body);
  }
  function adminSectionLongs(body){
    OCS.forEach((o)=>{
      const div = document.createElement("div");
      div.style.borderBottom = "1px solid #262a35";
      div.style.marginBottom = "14px";
      div.style.paddingBottom = "14px";
      div.innerHTML =
        '<div style="color:#cbb689;margin-bottom:6px;">'+esc(o.title)+' <small style="color:#7d7461">('+esc(o.id)+')</small></div>' +
        '<label>秘辛长文（一整篇小说正文）</label><textarea id="lg-'+o.id+'" style="min-height:170px">'+esc(o.long||"")+'</textarea>' +
        '<button onclick="saveLong(\''+o.id+'\')">保存长文</button>';
      body.appendChild(div);
    });
    adminFooterForLvl(body);
  }
  // 二层：给图鉴/秘辛分栏尾也放密令(方便), 但新增/删除编辑统一在“名录文字”里做。为避免入口混乱，
  // 二层图鉴/秘辛只提供编辑, 新增/删除/密令集中在名录分栏。
  function adminFooterForLvl(body){
    if(adminLevel===2){
      body.innerHTML += '<div class="sep"></div><div class="tip">新增 · 删除 · 密令 请在「名录文字」分栏处理。</div>' +
        '<div class="sep"></div><div class="pwbox"><h4>🔑 管理密令</h4>' +
        '<div class="row"><label>一层密令</label><input type="text" id="pA" value="'+esc(pwd.a)+'"></div>' +
        '<div class="row"><label>二层密令</label><input type="text" id="pC" value="'+esc(pwd.c)+'"></div>' +
        '<button onclick="savePwd()">保存密令</button></div>';
    }
  }

  // ===== 保存 =====
  function saveStory(id){
    const o = OCS.find(x=>x.id===id); if(!o) return;
    o.title = document.getElementById("t-"+id).value;
    o.rank  = document.getElementById("r-"+id).value;
    o.lock  = document.getElementById("l-"+id).value;
    o.story = document.getElementById("s-"+id).value;
    saveData(); renderAll(); renderAdminBody(); alert("本篇已保存");
  }
  function saveImg(id){
    const o = OCS.find(x=>x.id===id); if(!o) return;
    o.img = document.getElementById("im-"+id).value;
    saveData(); renderAll(); renderAdminBody(); alert("图已更新");
  }
  function saveLong(id){
    const o = OCS.find(x=>x.id===id); if(!o) return;
    o.long = document.getElementById("lg-"+id).value;
    saveData(); renderAll(); renderAdminBody(); alert("长文已保存");
  }

  function delOC(id){
    if(!confirm("确定整位删除？（名录 / 图鉴 / 秘辛 一并移除）")) return;
    OCS = OCS.filter(x=>x.id!==id);
    delete unlockedSet[id];
    saveData(); renderAll(); renderAdminBody();
  }

  function addOC(){
    const t = document.getElementById("newT").value.trim();
    const c = document.getElementById("newC").value.trim();
    if(!t || !c){ alert("称号和古神名不能空"); return; }
    OCS.push({
      id:"n"+Date.now(),
      title:t,
      en: (document.getElementById("newE").value||"").trim()||"?",
      code:c,
      mystery:(document.getElementById("newM").value||"").trim()||"",
      note: document.getElementById("newM").value?"自拟":"",
      img:"", long:"",
      lock:(document.getElementById("newL").value||"").trim()||"一位尚未为人所知的祂",
      story:(document.getElementById("newS").value||"").trim()||"待补。"
    });
    saveData(); renderAdminBody(); renderAll(); renderAdminTabs(); alert("已新增一位");
  }

  function saveData(){ localStorage.setItem(LS, JSON.stringify(OCS)); }
  function savePwd(){
    pwd.a = document.getElementById("pA").value;
    pwd.c = document.getElementById("pC").value;
    localStorage.setItem(LSP, JSON.stringify(pwd));
    alert("密令已更新，请牢记！");
  }

  // ===== 启动 =====
  OCS.forEach((o,i)=>{ if(!o.rank) o.rank="第"+"一二三四五六七八九十"[i] || "第"+(i+1); });
  saveData();
</script>
</body>
</html>
